<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sal's Kitchen</title>
  <meta name="description" content="Sal's Kitchen by Chef Sal Romano — restaurant-style recipes for your home kitchen, with a servings scaler, cooking mode, timers and a shopping list.">
  <meta name="theme-color" content="#2a1d17">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sal's Kitchen">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the chosen light/dark setting before the page draws (avoids a flash).
    try { var t = localStorage.getItem('sal-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to main content</a>
  <header class="app-header">
    <div class="app-header__inner">
      <button type="button" class="header-btn" id="back-btn" hidden aria-label="Back">
        <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <a class="brand" href="#/" id="brand">
        <img class="brand__avatar" src="assets/sal-avatar.png" alt="" width="40" height="40">
        <span class="brand__text">
          <span class="brand__name">Sal's Kitchen</span>
          <span class="brand__by">Chef Sal Romano</span>
        </span>
      </a>
      <a class="header-btn" href="#/list" id="list-btn" aria-label="Shopping list" hidden>
        <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2.2l2.2 11h10.4l2-8H6.3"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>
        <span class="header-btn__label">List</span>
        <span class="count-badge" id="list-count" hidden></span>
      </a>
      <a class="header-btn" href="#/settings" id="settings-btn" aria-label="Settings" hidden>
        <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span class="header-btn__label">Settings</span>
      </a>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <p class="loading">Loading…</p>
  </main>

  <section class="timer-tray" id="timer-tray" aria-label="Kitchen timers" hidden></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p class="noscript">This app needs JavaScript turned on in your browser.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
